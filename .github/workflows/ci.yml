name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, ${{ matrix.deps }}
    # GitHub-hosted runner (ubuntu-latest).
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # lowest: the oldest Kirby 5 and the oldest dependencies allowed by composer.json.
        # locked: the exact versions in composer.lock.
        # highest: the newest versions allowed by composer.json (ignores composer.lock).
        deps: [lowest, locked, highest]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, curl, dom
          coverage: none

      - name: Install dependencies, lowest versions
        if: matrix.deps == 'lowest'
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable

      - name: Install dependencies, locked versions
        if: matrix.deps == 'locked'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install dependencies, highest versions
        if: matrix.deps == 'highest'
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Tests (Kirby as fixture)
        run: vendor/bin/phpunit

  analysis:
    name: Analysis, PHP 8.4
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      # PHPMD 2.15 prints deprecation notices on PHP 8.5, so the analysis runs on 8.4.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer validate
        run: composer validate --strict --no-check-version --no-check-all

      - name: Composer normalize
        run: composer normalize:check

      - name: Undeclared dependencies
        run: composer analyze:require-checker

      - name: Unused dependencies
        run: composer analyze:unused

      # phpcpd is installed globally: its 6.0.3 needs sebastian/cli-parser 1.x, which PHPUnit 11 does not allow.
      - name: Install phpcpd
        run: |
          composer global require --no-interaction sebastian/phpcpd:6.0.3
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"

      - name: Duplicated code
        run: phpcpd --fuzzy --exclude tests --exclude vendor .

      - name: Platform requirements
        run: composer check-platform-reqs

      - name: Psalm
        run: composer analyze:psalm

      - name: PHP Mess Detector
        run: composer analyze:phpmd

  style:
    name: Code style, PHP 8.4
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      # getkirby/php-cs needs PHP 8.3 or newer, so it is installed globally and
      # not as a dependency: the package itself supports PHP 8.2.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install php-cs
        run: |
          composer global require --no-interaction getkirby/php-cs:0.2.1
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"

      - name: Check code style
        run: kirby-cs fix --dry-run --diff

  # Kirby 6 is a pre-release. This job runs the same tests against it so the
  # next major shows up early. Failing tests show up as a warning and never
  # fail the workflow. composer.json and the tags stay on Kirby 5.
  kirby-6:
    name: Kirby 6 pre-release, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Kirby 6 supports PHP 8.3 to 8.5.
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, curl, dom
          coverage: none

      # platform.php resolves the dependencies for PHP 8.2, which Kirby 6 no
      # longer supports. ^6.0@beta installs the newest Kirby 6 release: a beta
      # or release candidate until the stable version is out.
      - name: Install dev dependencies with Kirby 6
        run: |
          composer config --unset platform.php
          composer require --dev 'getkirby/cms:^6.0@beta' --with-all-dependencies --no-interaction --no-progress --prefer-dist

      - name: Tests
        run: vendor/bin/phpunit || echo "::warning title=Kirby 6::Tests fail against the Kirby 6 pre-release, see the log"

  script:
    name: monban.js
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # monban.js is the plugin's own code; the ALTCHA files are copied from the npm package as they are.
      - name: Syntax check, no storage, no cookies, no foreign host, no inline style
        run: |
          node --check assets/monban.js
          if grep -nE 'localStorage|sessionStorage|document\.cookie|indexedDB' assets/monban.js; then
            echo "::error::monban.js must not store anything in the browser"; exit 1
          fi
          if grep -nPi 'https?://(?!github\.com/sayamaapps)' assets/monban.js assets/monban.css; then
            echo "::error::monban.js and monban.css must not name any address except the project page"; exit 1
          fi
          if grep -nE '\.style\.|setAttribute\((["'"'"'])style\1|style=' assets/monban.js; then
            echo "::error::monban.js must not set inline styles (CSP: style-src self)"; exit 1
          fi

      # Static checks of sites read src/ too: every script tag must show its src, no <script in comments.
      - name: Every script tag names its src
        run: |
          if grep -n '<script' src/*.php assets/monban.js | grep -v '<script src='; then
            echo "::error::a script tag without a visible src attribute"; exit 1
          fi

      # The ALTCHA build in assets/ must be the external one: styles and workers as files, nothing injected.
      - name: ALTCHA build without style injection and without blob workers
        run: |
          if grep -c 'createElement("style")' assets/altcha.js | grep -qv '^0$'; then
            echo "::error::assets/altcha.js injects a <style> element; copy dist/external/altcha.min.js"; exit 1
          fi
          if grep -q 'blob:' assets/altcha.js; then
            echo "::error::assets/altcha.js creates blob: URLs"; exit 1
          fi
